# 知鉴 Search 后端 Nginx 反代 + HTTPS（任务 A3）
#
# 前端从 https 页面调 http 会被浏览器拦，所以对外必须 HTTPS。
# 证书用 certbot 一键签发：sudo certbot --nginx -d your-domain.example.com
# CORS 已在 FastAPI 层 allow_origins=["*"] 放开，此处不重复加头。

server {
    listen 80;
    server_name your-domain.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.example.com;

    # 由 certbot 自动填入：
    # ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    # 一次检索 4-6 秒，前端设 8s 超时；反代超时放 15s 留余量
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
