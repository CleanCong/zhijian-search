<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知鉴 · 把各说各话的经验，压成一张能下决定的卡片</title>
<style>
  :root{
    --bg:#FBFAF7;
    --card:#FFFFFF;
    --ink:#1A1A18;
    --ink-2:#4A4A45;
    --ink-3:#8A8A82;
    --ink-4:#B5B5AC;
    --line:#E8E5DD;
    --line-soft:#F0EDE6;
    --accent:#14604E;
    --accent-soft:#EAF3EF;
    --warn:#9A5B1E;
    --warn-soft:#FBF2E6;
    --shadow:0 1px 2px rgba(26,26,24,.04), 0 8px 24px -12px rgba(26,26,24,.10);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.75;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
  a{color:inherit;text-decoration:none;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    display:none;
    align-items:center;gap:16px;
    padding:12px 28px;
    background:rgba(251,250,247,.86);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line-soft);
  }
  .topbar.on{display:flex;}
  .brand{
    display:flex;align-items:center;gap:9px;
    font-weight:600;font-size:15px;letter-spacing:.01em;
    cursor:pointer;flex-shrink:0;
  }
  .brand-mark{
    width:22px;height:22px;border-radius:6px;
    background:var(--accent);
    display:grid;place-items:center;
    color:#fff;font-size:12px;font-weight:700;
    letter-spacing:0;
  }
  .topbar .miniq{
    flex:1;max-width:520px;
    display:flex;align-items:center;gap:8px;
    height:34px;padding:0 12px;
    background:#fff;border:1px solid var(--line);
    border-radius:999px;font-size:13.5px;color:var(--ink-3);
    overflow:hidden;white-space:nowrap;
    cursor:text;transition:border-color .18s;
  }
  .topbar .miniq:hover{border-color:#D6D2C6;}
  .topbar .miniq span{overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);}
  .topbar .spacer{flex:1;}
  .status{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--ink-3);
    white-space:nowrap;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:#3FA37C;}
  .detail-toggle{
    font-size:12.5px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;transition:.18s;white-space:nowrap;
  }
  .detail-toggle:hover{color:var(--ink-2);border-color:#D6D2C6;}
  .detail-toggle.on{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---------- 首页 ---------- */
  #home{
    min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:64px 24px 120px;
    text-align:center;
  }
  .home-mark{
    width:52px;height:52px;border-radius:15px;
    background:var(--accent);
    display:grid;place-items:center;
    color:#fff;font-size:23px;font-weight:600;
    margin-bottom:28px;
    box-shadow:0 10px 28px -12px rgba(20,96,78,.5);
  }
  #home h1{
    font-size:27px;line-height:1.5;font-weight:600;
    letter-spacing:-.01em;max-width:660px;
    margin-bottom:12px;
  }
  #home h1 em{
    font-style:normal;
    background:linear-gradient(transparent 68%, #D5E8E0 68%);
    padding:0 3px;
  }
  #home .lede{
    font-size:15px;color:var(--ink-3);max-width:540px;
    margin-bottom:38px;
  }
  .searchbox{
    width:100%;max-width:620px;
    display:flex;align-items:center;gap:12px;
    height:58px;padding:0 8px 0 22px;
    background:#fff;border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    transition:border-color .2s, box-shadow .2s;
  }
  .searchbox:focus-within{
    border-color:#C9C4B4;
    box-shadow:0 2px 4px rgba(26,26,24,.04), 0 16px 40px -18px rgba(26,26,24,.20);
  }
  .searchbox input{
    flex:1;border:none;outline:none;background:none;
    font-size:16px;color:var(--ink);font-family:inherit;
  }
  .searchbox input::placeholder{color:var(--ink-4);}
  .go{
    height:42px;padding:0 22px;border-radius:11px;
    background:var(--ink);color:#fff;
    font-size:14.5px;font-weight:500;
    transition:.18s;flex-shrink:0;
  }
  .go:hover{background:#000;}
  .topics{
    margin-top:30px;display:flex;flex-wrap:wrap;
    gap:9px;justify-content:center;max-width:640px;
  }
  .topic{
    display:flex;align-items:center;gap:7px;
    padding:7px 14px;border-radius:999px;
    background:#fff;border:1px solid var(--line);
    font-size:13px;color:var(--ink-2);
    transition:.18s;
  }
  .topic:hover{border-color:#C9C4B4;transform:translateY(-1px);}
  .topic i{
    font-style:normal;font-size:10.5px;color:var(--ink-4);
    padding-left:7px;border-left:1px solid var(--line);
  }
  .home-foot{
    position:absolute;bottom:26px;
    font-size:12px;color:var(--ink-4);
    display:flex;align-items:center;gap:14px;
  }
  .home-foot span{display:flex;align-items:center;gap:6px;}

  /* ---------- 加载 ---------- */
  #loading{
    display:none;
    max-width:760px;margin:0 auto;
    padding:72px 32px 120px;
  }
  .sk-line{
    height:13px;border-radius:6px;
    background:linear-gradient(90deg,#F0EDE6 25%,#F7F5F0 50%,#F0EDE6 75%);
    background-size:200% 100%;
    animation:shimmer 1.5s infinite linear;
    margin-bottom:12px;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .loading-steps{
    margin-top:34px;display:flex;flex-direction:column;gap:11px;
    font-size:13.5px;color:var(--ink-4);
  }
  .loading-steps b{font-weight:400;transition:color .3s;}
  .loading-steps b.done{color:var(--ink-2);}
  .loading-steps b.done::before{content:"✓ ";}
  .loading-steps b.now{color:var(--accent);}
  .loading-steps b.now::before{content:"· ";}

  /* ---------- 结果页 ---------- */
  #result{display:none;max-width:780px;margin:0 auto;padding:44px 32px 140px;}

  .qhead{margin-bottom:30px;}
  .qhead .q{
    font-size:22px;font-weight:600;line-height:1.5;
    letter-spacing:-.01em;margin-bottom:8px;
  }
  .qhead .meta{
    font-size:12.5px;color:var(--ink-4);
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  }
  .qhead .meta .sep{color:#DCD8CE;}

  /* 结论区 */
  .verdict{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 32px 28px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .verdict .kicker{
    font-size:11.5px;letter-spacing:.14em;
    color:var(--accent);font-weight:600;
    margin-bottom:14px;
  }
  .verdict h2{
    font-size:26px;line-height:1.45;font-weight:600;
    letter-spacing:-.015em;margin-bottom:12px;
  }
  .verdict .sub{
    font-size:14.5px;color:var(--ink-3);line-height:1.8;
    padding-bottom:22px;border-bottom:1px solid var(--line-soft);
    margin-bottom:20px;
  }
  .verdict ul{list-style:none;display:flex;flex-direction:column;gap:13px;}
  .verdict li{
    position:relative;padding-left:17px;
    font-size:14.5px;color:var(--ink-2);line-height:1.8;
  }
  .verdict li::before{
    content:"";position:absolute;left:2px;top:9px;
    width:5px;height:5px;border-radius:50%;
    background:#CFCBC0;
  }

  /* 三段 */
  .block{margin-top:34px;}
  .block-head{
    display:flex;align-items:baseline;gap:11px;
    padding-bottom:11px;border-bottom:1px solid var(--line);
    margin-bottom:2px;
  }
  .block-head h3{
    font-size:15.5px;font-weight:600;letter-spacing:.01em;
  }
  .block-head .tag{
    font-size:11.5px;color:var(--ink-4);
  }
  .item{
    padding:19px 0 18px;
    border-bottom:1px solid var(--line-soft);
    display:flex;gap:16px;
  }
  .item:last-child{border-bottom:none;}
  .item .body{flex:1;min-width:0;}
  .item p{
    font-size:14.5px;line-height:1.85;color:var(--ink);
    margin-bottom:10px;
  }
  .src{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:12px;color:var(--ink-4);
  }
  .src .who{
    color:var(--ink-3);
    border-bottom:1px dashed #DCD8CE;
    padding-bottom:1px;
  }
  .src .yr{color:var(--ink-4);}
  .src .votes{
    color:var(--ink-3);background:#F5F3ED;
    padding:1px 8px;border-radius:5px;
    margin-right:3px;
  }
  .src .sect{color:#D8D4C9;}
  .item .idx{
    flex-shrink:0;width:22px;
    font-size:11.5px;color:var(--ink-4);
    font-variant-numeric:tabular-nums;
    padding-top:3px;
  }
  .item.pit .idx{color:var(--warn);}

  /* 收起区 */
  .fold{
    margin-top:38px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#FDFCF9;
    overflow:hidden;
  }
  .fold-bar{
    display:flex;align-items:center;gap:12px;
    padding:16px 20px;
    cursor:pointer;
    transition:background .18s;
    user-select:none;
  }
  .fold-bar:hover{background:#FAF8F2;}
  .fold-bar .n{
    font-size:12px;color:var(--ink-3);
    background:#EFECE4;border-radius:6px;
    padding:2px 8px;flex-shrink:0;
  }
  .fold-bar .t{font-size:14px;color:var(--ink-2);}
  .fold-bar .arrow{
    margin-left:auto;flex-shrink:0;
    width:8px;height:8px;
    border-right:1.6px solid var(--ink-3);
    border-bottom:1.6px solid var(--ink-3);
    transform:rotate(45deg) translateY(-2px);
    transition:transform .25s;
  }
  .fold.open .fold-bar .arrow{transform:rotate(-135deg) translateY(-2px);}
  .fold-body{display:none;padding:0 20px 8px;}
  .fold.open .fold-body{display:block;}
  .fold-note{
    font-size:12.5px;color:var(--ink-4);
    padding:0 0 16px;line-height:1.7;
  }
  .hid{
    padding:16px 0;
    border-top:1px solid var(--line-soft);
  }
  .hid .why{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;color:var(--warn);
    background:var(--warn-soft);
    border-radius:5px;padding:2px 9px;
    margin-bottom:9px;
  }
  .hid .txt{
    font-size:14px;line-height:1.8;color:#6E6E66;
    margin-bottom:8px;
  }
  .hid .detail{
    font-size:12.5px;color:var(--ink-4);line-height:1.7;
    padding-left:11px;border-left:2px solid var(--line);
    margin-bottom:8px;
  }
  .hid .src{margin-bottom:9px;}
  .override{
    font-size:12px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:6px;
    padding:4px 10px;background:#fff;
    transition:.18s;
  }
  .override:hover{border-color:#C9C4B4;color:var(--ink-2);}
  .override.did{
    background:var(--accent-soft);color:var(--accent);
    border-color:#CFE6DC;
  }

  /* 技术细节 */
  .tech{display:none;margin-top:30px;
    border:1px dashed #D8D4C9;border-radius:12px;
    padding:20px 22px;background:#FCFCFA;}
  .tech.on{display:block;}
  .tech h4{
    font-size:11.5px;letter-spacing:.12em;color:var(--ink-4);
    font-weight:600;margin-bottom:16px;
  }
  .trace{display:flex;flex-direction:column;gap:0;}
  .tr{
    display:flex;gap:14px;font-size:12.5px;
    padding:9px 0;border-bottom:1px dotted #EAE7DE;
  }
  .tr:last-child{border-bottom:none;}
  .tr .lb{width:88px;flex-shrink:0;color:var(--ink-3);}
  .tr .dt{color:var(--ink-4);flex:1;font-variant-numeric:tabular-nums;}
  .tstats{
    display:flex;gap:22px;margin-top:16px;
    padding-top:15px;border-top:1px solid var(--line-soft);
  }
  .tstat .v{font-size:19px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.3;}
  .tstat .k{font-size:11px;color:var(--ink-4);}

  /* 底部动作 */
  .actions{
    margin-top:36px;display:flex;gap:10px;flex-wrap:wrap;
  }
  .act{
    height:40px;padding:0 19px;border-radius:10px;
    border:1px solid var(--line);background:#fff;
    font-size:13.5px;color:var(--ink-2);
    display:inline-flex;align-items:center;gap:7px;
    transition:.18s;
  }
  .act:hover{border-color:#C9C4B4;transform:translateY(-1px);}
  .act.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .act.primary:hover{background:#000;}

  .result-foot{
    margin-top:44px;padding-top:18px;
    border-top:1px solid var(--line-soft);
    font-size:11.5px;color:var(--ink-4);
    display:flex;justify-content:space-between;gap:16px;
  }
  .result-foot button{
    color:var(--ink-3);border-bottom:1px dotted #DCD8CE;
    font-size:11.5px;
  }

  /* ---------- 空结果 ---------- */
  #empty{display:none;max-width:640px;margin:0 auto;padding:88px 32px 140px;text-align:center;}
  #empty .icon{
    width:44px;height:44px;border-radius:12px;
    background:#F2EFE8;color:var(--ink-3);
    display:grid;place-items:center;margin:0 auto 22px;
    font-size:19px;
  }
  #empty h2{font-size:20px;font-weight:600;margin-bottom:12px;}
  #empty .why{
    font-size:14px;color:var(--ink-3);line-height:1.85;
    max-width:480px;margin:0 auto 30px;
  }
  #empty .opts{
    display:flex;flex-direction:column;gap:9px;
    max-width:440px;margin:0 auto 26px;text-align:left;
  }
  .opt{
    display:flex;align-items:center;gap:13px;
    padding:13px 16px;border:1px solid var(--line);
    border-radius:10px;background:#fff;transition:.18s;
  }
  .opt:hover{border-color:#C9C4B4;}
  .opt .lab{font-size:13.5px;color:var(--ink);}
  .opt .hint{font-size:11.5px;color:var(--ink-4);margin-top:2px;}
  .opt .go2{margin-left:auto;font-size:11.5px;color:var(--ink-4);flex-shrink:0;}

  @media (max-width:680px){
    .topbar{padding:10px 16px;gap:10px;}
    .topbar .spacer,.detail-toggle{display:none;}
    #result{padding:28px 18px 100px;}
    .verdict{padding:24px 20px;}
    .verdict h2{font-size:22px;}
    #home h1{font-size:22px;}
    .home-foot{display:none;}
  }
</style>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar" id="topbar">
  <div class="brand" onclick="goHome()">
    <div class="brand-mark">鉴</div>
    <span>知鉴</span>
  </div>
  <div class="miniq" onclick="goHome()"><span id="miniq-text">问点什么</span></div>
  <div class="spacer"></div>
  <div class="status"><i class="dot"></i>离线演示 · 本地数据</div>
  <button class="detail-toggle" id="dtoggle" onclick="toggleTech()">显示技术细节</button>
</header>

<!-- ============ 首页 ============ -->
<section id="home">
  <div class="home-mark">鉴</div>
  <h1>把知乎上各说各话的二十篇经验，<br><em>压成一张能下决定的卡片</em></h1>
  <p class="lede">不替你做决定。只把该看的看完，把不该信的标出来，正反两面都摆在桌上。</p>

  <div class="searchbox">
    <input id="q" type="text" placeholder="比如：两千块扫地机器人，石头和追觅怎么选" autocomplete="off">
    <button class="go" onclick="startSearch()">开始</button>
  </div>

  <div class="topics" id="topics"></div>

  <div class="home-foot">
    <span><i class="dot"></i>离线可运行</span>
    <span>不联网也能演示</span>
  </div>
</section>

<!-- ============ 加载 ============ -->
<section id="loading">
  <div class="sk-line" style="width:62%;height:22px;"></div>
  <div class="sk-line" style="width:88%;margin-top:18px;"></div>
  <div class="sk-line" style="width:74%;"></div>
  <div class="loading-steps" id="lsteps"></div>
</section>

<!-- ============ 结果页 ============ -->
<section id="result">
  <div class="qhead">
    <div class="q" id="rq"></div>
    <div class="meta">
      <span id="rmeta"></span>
      <span class="sep">·</span>
      <span id="rcount"></span>
    </div>
  </div>

  <div class="verdict">
    <div class="kicker" id="rkicker">先说结论</div>
    <h2 id="rhead"></h2>
    <div class="sub" id="rsub"></div>
    <ul id="rquick"></ul>
  </div>

  <div id="blocks"></div>

  <div class="fold" id="fold">
    <div class="fold-bar" onclick="toggleFold()">
      <span class="n" id="foldn"></span>
      <span class="t" id="foldt"></span>
      <span class="arrow"></span>
    </div>
    <div class="fold-body" id="foldbody"></div>
  </div>

  <div class="tech" id="tech"></div>

  <div class="actions">
    <button class="act primary" onclick="alert('下一版做：勾选要点 → 重组成自己的资料')">自己挑重点重组</button>
    <button class="act" onclick="alert('下一版做：把这份判断生成一段分镜讲解')">生成讲解视频</button>
  </div>

  <div class="result-foot">
    <span>以上内容来自公开的社区讨论，标注了每一条的出处与时间。</span>
    <button onclick="toggleTech()">这些答案是怎么挑出来的 →</button>
  </div>
</section>

<!-- ============ 空结果 ============ -->
<section id="empty">
  <div class="icon">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>
    </svg>
  </div>
  <h2 id="etitle"></h2>
  <p class="why" id="ereason"></p>
  <div class="opts" id="eopts"></div>
  <button class="act" onclick="goHome()">换个问法</button>
</section>

<script>
/* ===========================================================
   知鉴 Search · 演示数据（第一阶段全部为本地假数据）
   替换为真实引擎时，只需保持同名结构即可
   =========================================================== */

const DATASETS = {
  /* ---------- 主场景：对比选购 ---------- */
  vacuum: {
    id: 'vacuum',
    query: '2000块左右的扫地机器人，石头和追觅怎么选',
    intentWord: '对比选购',
    headline: '这个价位，两家的差距不在扫得干不干净',
    subline: '差别在「地图会不会丢」和「耗材一年要多少钱」——这两件事，参数表上看不出来。',
    quickAnswer: [
      '两千价位两家的清扫能力拉不开差距，实测差异都在噪音和边角覆盖上，日常用几乎察觉不到。',
      '真正的分水岭是稳定性：石头的地图记忆更稳，追觅早期批次的机器人在多层户型里出现过丢图，需要重新建图。',
      '如果家里有长发或宠物，优先看主刷结构而不是吸力数字——缠绕清理的频率比吸力大小影响体验更大。',
      '两家在这个价位的耗材年成本都在 200–350 元区间，别信「耗材终身免费」的说法，通常是首年赠品。'
    ],
    consensus: [
      {
        text: '两千元档的清扫能力已经过剩。硬地板上的灰尘、毛发、瓜子壳，两家都能一次过，差别要到「缝隙里的细沙」这种极限场景才看得出来。',
        votes: '21 篇回答里有 17 篇持这个观点',
        sources: [
          { author: '陈默', title: '用了三年扫地机，说点参数表不会写的', year: 2025 },
          { author: '拿铁不加糖', title: '石头 G 系列和追觅 S 系列的长期对比', year: 2024 }
        ]
      },
      {

/* 首页示例话题 */
const TOPICS = [
  { key: 'vacuum', label: '两千块扫地机器人怎么选', hint: '对比选购' },
  { key: 'renovation', label: '全屋定制怎么避免被坑', hint: '经验避坑 · 空结果演示' }
];

</script>
<script>
/* ---------------- 基础 ---------------- */
const $ = id => document.getElementById(id);
let CURRENT = null;
let TECH_ON = false;

/* 首页话题 chips */
(function initTopics(){
  $('topics').innerHTML = TOPICS.map(t =>
    `<button class="topic" onclick="pick('${t.key}')">${t.label}<i>${t.hint}</i></button>`
  ).join('');
})();

function pick(key){
  $('q').value = DATASETS[key].query;
  startSearch(key);
}
$('q').addEventListener('keydown', e => { if(e.key === 'Enter') startSearch(); });

/* ---------------- 视图切换 ---------------- */
function show(which){
  ['home','loading','result','empty'].forEach(v => {
    $(v).style.display = (v === which) ? (v === 'home' ? 'flex' : 'block') : 'none';
  });
  $('topbar').classList.toggle('on', which !== 'home');
  window.scrollTo({top:0, behavior:'instant'});
}
function goHome(){
  CURRENT = null;
  $('q').value = '';
  if(TECH_ON){
    TECH_ON = false;
    $('tech').classList.remove('on');
    $('dtoggle').classList.remove('on');
    $('dtoggle').textContent = '显示技术细节';
  }
  show('home');
  setTimeout(()=>$('q').focus(), 80);
}

/* ---------------- 搜索 ---------------- */
const STEPS = [
  '正在读你这个问题…',
  '找到 24 篇相关内容…',
  '排掉 2 年前的旧机型…',
  '看看有没有在卖东西的…',
  '把不同说法归到一起…'
];

function startSearch(forceKey){
  const q = ($('q').value || '').trim();
  let data = forceKey ? DATASETS[forceKey] : matchDataset(q);
  if(!data){
    data = DATASETS.vacuum;
  }
  CURRENT = data;
  $('miniq-text').textContent = data.query;

  show('loading');
  $('lsteps').innerHTML = STEPS.map((s,i) =>
    `<b id="st${i}">${s}</b>`).join('');

  const seq = [0,1,2,3,4];
  seq.forEach((n,i) => {
    setTimeout(()=>{
      for(let k=0;k<=i;k++){ const el=$('st'+k); if(el){ el.className = k===i ? 'now' : 'done'; } }
      if(i === seq.length-1){
        setTimeout(()=>render(data), 620);
      }
    }, i * 340);
  });
}

function matchDataset(q){
  if(!q) return DATASETS.vacuum;
  if(/定制|装修|全屋/.test(q)) return DATASETS.renovation;
  return DATASETS.vacuum;
}

/* ---------------- 渲染 ---------------- */
function hiddenHTML(hid){
  return `<div class="fold-note">没有删掉它们。你自己看一眼，判断权在你手上。</div>` +
    hid.map(h => `
      <div class="hid">
        <div class="why">为什么收起：${h.reason}</div>
        <div class="txt">${h.text}</div>
        <div class="detail">${h.detail}</div>
        <div class="src">
          ${h.sources.map(s => `<span class="who">知乎 · ${s.author}</span><span class="yr">${s.year}</span>`).join('')}
        </div>
        <button class="override" onclick="override(this)">我认为这条没问题</button>
      </div>`).join('');
}

function render(d){
  if(d.empty){ renderEmpty(d); return; }
  show('result');
  $('dtoggle').style.visibility = 'visible';

  $('rq').textContent = d.query;
  $('rmeta').textContent = d.intentWord + '类问题';
  $('rcount').textContent = '读了 ' + d.stats.recalled + ' 篇，留下 ' + (d.stats.afterQuality) + ' 篇';

  $('rkicker').textContent = '先说结论';
  $('rsub').style.cssText = '';
  $('rhead').textContent = d.headline;
  $('rsub').textContent = d.subline;
  $('rquick').innerHTML = d.quickAnswer.map(t => `<li>${t}</li>`).join('');

  /* 三段 */
  const blocks = [
    { key:'consensus', title:'大家都这么说', tag:'多篇独立来源一致', cls:'' },
    { key:'disputed',  title:'说法不一的地方', tag:'同一个问题，结论相反', cls:'' },
    { key:'pitfalls',  title:'有人具体踩过的坑', tag:'带场景，能对上自己家', cls:'pit' }
  ];
  $('blocks').innerHTML = blocks.map(b => {
    const arr = d[b.key] || [];
    if(!arr.length) return '';
    const items = arr.map((it,i) => `
      <div class="item ${b.cls}">
        <div class="idx">${String(i+1).padStart(2,'0')}</div>
        <div class="body">
          <p>${it.text}</p>
          <div class="src">
            ${it.votes ? `<span class="votes">${it.votes}</span>` : ''}
            ${it.sources.map(s =>
              `<span class="who">知乎 · ${s.author}</span><span class="yr">${s.year}</span>`
            ).join('<span class="sect">/</span>')}
          </div>
        </div>
      </div>`).join('');
    return `
      <div class="block">
        <div class="block-head"><h3>${b.title}</h3><span class="tag">${b.tag}</span></div>
        ${items}
      </div>`;
  }).join('');

  /* 收起区 */
  const hid = d.hidden || [];
  $('foldn').textContent = hid.length + ' 条';
  $('foldt').textContent = '另有 ' + hid.length + ' 条内容，我们觉得你不该直接信';
  $('foldbody').innerHTML = hiddenHTML(hid);

  /* 技术细节 */
  $('tech').innerHTML =
    `<h4>技术细节 · 供评委查看，普通用户默认看不到</h4>
     <div class="trace">
       ${d.trace.map(t => `<div class="tr"><span class="lb">${t.label}</span><span class="dt">${t.detail}</span></div>`).join('')}
     </div>
     <div class="tstats">
       <div class="tstat"><div class="v">${d.stats.recalled}</div><div class="k">初始召回</div></div>
       <div class="tstat"><div class="v">${d.stats.afterTime}</div><div class="k">时效过滤后</div></div>
       <div class="tstat"><div class="v">${d.stats.afterQuality}</div><div class="k">可信内容</div></div>
       <div class="tstat"><div class="v">${d.stats.hidden}</div><div class="k">降权保留</div></div>
     </div>`;

  $('fold').classList.remove('open');
  $('tech').classList.toggle('on', TECH_ON);
}

function renderEmpty(d){
  show('empty');
  $('dtoggle').style.visibility = 'hidden';
  $('miniq-text').textContent = d.query;
  $('etitle').textContent = d.emptyTitle;
  $('ereason').textContent = d.emptyReason;
  $('eopts').innerHTML = d.emptyActions.map((a,i) =>
    `<div class="opt" onclick="emptyAction(${i})">
       <div><div class="lab">${a.label}</div><div class="hint">${a.hint}</div></div>
       <span class="go2">试试 →</span>
     </div>`).join('');
}

function emptyAction(i){
  const d = DATASETS.renovation;
  if(i === 1){
    /* 把被收起的 6 条摊开给用户自己判断 */
    show('result');
    $('rq').textContent = d.query;
    $('rmeta').textContent = '被收起的内容';
    $('rcount').textContent = '共 ' + d.hidden.length + ' 条';
    $('rkicker').textContent = '你自己判断';
    $('rsub').style.cssText = 'padding-bottom:0;border-bottom:none;margin-bottom:0;';
    $('rhead').textContent = '被我们收起的 ' + d.hidden.length + ' 条，长这样';
    $('rsub').textContent = '它们确实在讲「全屋定制」，但每一条的最终目的都是让你联系他。你看一眼，判断权在你手上。';
    $('rquick').innerHTML = '';
    $('blocks').innerHTML = '';
    $('foldn').textContent = d.hidden.length + ' 条';
    $('foldt').textContent = '全部被收起的内容';
    $('foldbody').innerHTML = hiddenHTML(d.hidden);
    $('tech').innerHTML =
      `<h4>技术细节 · 供评委查看，普通用户默认看不到</h4>
       <div class="trace">
         ${d.trace.map(t => `<div class="tr"><span class="lb">${t.label}</span><span class="dt">${t.detail}</span></div>`).join('')}
       </div>
       <div class="tstats">
         <div class="tstat"><div class="v">${d.stats.recalled}</div><div class="k">初始召回</div></div>
         <div class="tstat"><div class="v">${d.stats.afterTime}</div><div class="k">时效过滤后</div></div>
         <div class="tstat"><div class="v">${d.stats.hidden}</div><div class="k">降权保留</div></div>
         <div class="tstat"><div class="v">0</div><div class="k">独立经验</div></div>
       </div>`;
    $('tech').classList.toggle('on', TECH_ON);
    $('fold').classList.add('open');
  } else {
    alert('下一版做：放宽时间窗后重新检索');
  }
}

/* ---------------- 交互 ---------------- */
function toggleFold(){ $('fold').classList.toggle('open'); }

function toggleTech(){
  TECH_ON = !TECH_ON;
  $('tech').classList.toggle('on', TECH_ON);
  $('dtoggle').classList.toggle('on', TECH_ON);
  $('dtoggle').textContent = TECH_ON ? '已显示技术细节' : '显示技术细节';
  if(TECH_ON && CURRENT) $('tech').scrollIntoView({behavior:'smooth', block:'center'});
}

function override(btn){
  if(btn.classList.contains('did')){
    btn.classList.remove('did');
    btn.textContent = '我认为这条没问题';
  } else {
    btn.classList.add('did');
    btn.textContent = '已记录你的判断 · 下次不再收起';
  }
}
</script>
